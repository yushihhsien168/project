<style>

:root{
  --coral:#FF5B39;
  --coral-deep:#E8472A;
  --indigo:#4B3F9E;
  --indigo-soft:#6E5AC4;
  --bg:#FFF6F1;
  --bg-card:#FFFFFF;
  --ink:#241C35;
  --ink-soft:#6B6480;
  --border:#F2DED4;
  --border-soft:#EAE3F5;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.9}
a{color:inherit}
.view{display:none}
.view.active{display:block}
h1,h2,h3,.eyebrow,.kpi .num,.card-num,.card-cat,.hero-num,.hero-cat{font-family:"Space Grotesk","PingFang TC","Microsoft JhengHei",sans-serif}

header{position:relative;background:linear-gradient(180deg,#FFF9F6,#FFF1EA);padding:70px 6% 60px;border-bottom:1px solid var(--border);overflow:hidden}
header::after{content:"PORTFOLIO 2026";position:absolute;bottom:20px;right:6%;font-size:80px;font-weight:700;color:rgba(75,63,158,.05);letter-spacing:-2px;pointer-events:none}
.hero-glow{position:absolute;top:-100px;right:-40px;width:560px;height:560px;background:radial-gradient(circle,rgba(255,91,57,.20) 0%,rgba(75,63,158,.10) 55%,transparent 72%);filter:blur(6px);border-radius:50%;pointer-events:none;z-index:1}
.hero-orbit{position:absolute;top:36px;right:7%;width:220px;height:220px;pointer-events:none;z-index:2}
.eyebrow{position:relative;z-index:3;display:inline-flex;align-items:center;gap:10px;background:rgba(255,91,57,.12);border:1px solid rgba(255,91,57,.35);color:var(--coral-deep);padding:6px 16px;border-radius:20px;font-size:12px;letter-spacing:3px;font-weight:700;margin-bottom:20px;white-space:nowrap}
header h1{position:relative;z-index:3;font-size:58px;color:var(--ink);font-weight:700;line-height:1.15;max-width:760px;margin-bottom:20px;text-wrap:balance}
header h1 .hl{color:var(--coral)}
header h1 .nowrap,.hero-cat,.card-cat{white-space:nowrap}
header h1,.hero-title-wrap h1,.card-body h3,.invest-head h2,.vision h2,.cta-box h2,.section h2{text-wrap:balance}
header .lead{position:relative;z-index:3;font-size:18px;color:var(--ink-soft);max-width:640px;margin-bottom:30px}
.kpi-bar{max-width:1400px;margin:-40px auto 40px;padding:0 6%;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative;z-index:3}
.kpi{background:var(--bg-card);border:1px solid var(--border);padding:24px;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(75,63,158,.07)}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--coral),var(--indigo))}
.kpi .num{font-size:36px;font-weight:700;color:var(--coral);line-height:1}
.kpi .label{font-size:12px;letter-spacing:2px;color:var(--indigo);margin-top:8px;font-weight:700}
.kpi .desc{font-size:13px;color:var(--ink-soft);margin-top:6px}
.grid{max-width:1400px;margin:0 auto;padding:60px 6% 30px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.card{background:var(--bg-card);border-radius:14px;overflow:hidden;border:1px solid var(--border);position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;--cat:#E8472A;box-shadow:0 2px 12px rgba(36,28,53,.05)}
.card:hover{transform:translateY(-4px);border-color:var(--cat);box-shadow:0 16px 32px rgba(36,28,53,.12)}
.card-head{position:relative;height:220px;overflow:hidden}
.card-head img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.98)}

.card-cat{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.92);color:var(--cat);padding:6px 12px;border-radius:20px;font-size:11px;letter-spacing:2px;font-weight:700;z-index:2;border:1px solid var(--cat)}
.card-body{padding:28px}
.card-body h3{font-size:24px;color:var(--ink);margin-bottom:8px;font-weight:700;line-height:1.3}
.card-body .value-line{color:var(--cat);font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.card-body p{color:var(--ink-soft);font-size:14px;margin-bottom:10px}
.card-body p strong{color:var(--cat)}
.card-cta{display:inline-flex;align-items:center;gap:8px;color:var(--cat);text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;border-bottom:2px solid var(--cat);padding-bottom:4px;background:none;cursor:pointer;font-family:inherit}
.invest{max-width:1400px;margin:0 auto;padding:50px 6% 20px}
.invest-head{text-align:center;margin-bottom:40px}
.invest-head h2{font-size:32px;color:var(--ink);font-weight:700;margin-bottom:12px}
.invest-head p{color:var(--ink-soft);font-size:16px;max-width:780px;margin:0 auto}
.invest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.invest-item{background:var(--bg-card);border:1px solid var(--border);border-top:4px solid var(--coral);border-radius:12px;padding:26px;box-shadow:0 2px 12px rgba(36,28,53,.05)}
.invest-item .icon{font-size:30px;margin-bottom:12px}
.invest-item h3{color:var(--indigo);font-size:17px;font-weight:700;margin-bottom:10px}
.invest-item p{color:var(--ink-soft);font-size:14px}
.vision{max-width:1400px;margin:0 auto;padding:60px 6% 80px;text-align:center}
.vision .box{background:linear-gradient(135deg,#FFF1EA,#F1EDFB);border:1px solid var(--border-soft);border-radius:16px;padding:50px 40px}
.vision h2{font-size:30px;color:var(--ink);font-weight:700;margin-bottom:16px;line-height:1.4}
.vision p{color:var(--ink-soft);font-size:16px;max-width:760px;margin:0 auto 26px}
.vision .cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--coral),var(--indigo));color:#fff;font-weight:700;padding:14px 34px;border-radius:30px;text-decoration:none;font-size:16px;letter-spacing:1px;border:none;cursor:pointer;font-family:inherit}
footer{background:#FBF2EE;padding:50px 6%;text-align:center;border-top:1px solid var(--border);color:var(--ink-soft);font-size:13px;letter-spacing:1px}

/* ---- 詳細頁（合併後共用一份樣式，套用各專案自己的 --cat 色） ---- */
.detail-view{--cat:#E8472A}

.hero{position:relative;max-width:1100px;margin:20px auto 0;padding:0 6%}
.hero-img-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);height:340px;background:var(--bg-card)}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.85)}

.hero-cat{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.92);color:var(--cat);padding:7px 14px;border-radius:20px;font-size:12px;letter-spacing:2px;font-weight:700;z-index:2;border:1px solid var(--cat)}
.hero-title-wrap{position:absolute;bottom:24px;left:28px;right:28px;z-index:2}
.hero-title-wrap h1{font-size:34px;color:#fff;font-weight:700;line-height:1.3;margin-bottom:8px}
.hero-title-wrap .value-line{color:#fff;opacity:.92;font-size:15px;font-weight:700}
main.detail-main{max-width:900px;margin:0 auto;padding:50px 6% 20px}
.section{margin-bottom:52px}
.section h2{font-size:22px;color:var(--cat);font-weight:700;letter-spacing:1px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.section h2::before{content:"";width:6px;height:22px;background:var(--cat);border-radius:2px;display:inline-block}
.section p{color:var(--ink-soft);font-size:16px;margin-bottom:14px}
.persona{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--cat);border-radius:8px;padding:22px 26px;margin-bottom:20px;box-shadow:0 2px 10px rgba(36,28,53,.04)}
.persona .persona-name{color:var(--cat);font-weight:700;font-size:16px;margin-bottom:10px}
.persona p{margin-bottom:0;font-size:15px;color:var(--ink-soft)}
ul.plain-list{list-style:none;padding:0}
ul.plain-list li{position:relative;padding-left:24px;margin-bottom:14px;color:var(--ink-soft);font-size:16px}
ul.plain-list li::before{content:"›";position:absolute;left:0;color:var(--cat);font-weight:900;font-size:18px}
ul.plain-list li strong{color:var(--cat)}
.tech-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tech-tags span{font-size:12px;background:#fff;color:var(--cat);padding:6px 14px;border-radius:20px;border:1px solid var(--cat)}
.cta-box{background:linear-gradient(135deg,#fff,var(--bg));border:1px solid var(--cat);border-radius:12px;padding:36px 34px;text-align:center;margin-top:10px}
.cta-box h2{color:var(--ink);font-size:24px;font-weight:700;margin-bottom:12px;line-height:1.4;border:none;padding:0}
.cta-box h2::before{display:none}
.cta-box p{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
.cta-box .cta{display:inline-flex;align-items:center;gap:10px;background:var(--cat);color:#fff;font-weight:700;padding:12px 30px;border-radius:24px;text-decoration:none;font-size:15px;letter-spacing:1px;border:none;cursor:pointer;font-family:inherit}

.site-nav .nav-cta{margin-left:auto;background:var(--ink);color:#fff;padding:9px 18px;border-radius:22px}.site-nav .nav-cta:hover{color:#fff;background:var(--indigo)}

<span class="eyebrow">★ 澄思 AI STUDIO · AI 決策作業系統</span>
<h1>真正昂貴的，<br/><span class="hl nowrap">不是 AI，而是做錯決定。</span></h1>
<p class="lead">每天，企業花時間整理資料、追進度、判斷風險、篩選人才；每個人也在面對轉職、投資、關係與人生選擇。資訊越來越多，真正能替你承擔「理解、比較、判斷」的時間卻越來越少。澄思做的，不是再多一個聊天機器人，而是一層能進入真實工作與真實人生的決策能力。</p>

<section class="home-intro" id="problem">
<div class="section-kicker">WHY NOW</div>
<h2>AI 已經很會回答問題。<br/>企業真正缺的是：<span class="hl">有人把問題接住。</span></h2>
<p>一個老闆知道營收下滑，卻不知道下一步該先動價格、渠道還是產品；一個資安工程師看到告警，卻必須自己判斷哪一個值得立刻處理；一個 HR 面對數百份履歷，怕漏掉好人才，也怕錯過公平；一個求職者被拒絕幾次後，開始懷疑是不是自己不夠好。這些都不是「缺答案」的問題，而是<strong>缺少一套能把複雜事情變成下一步的能力。</strong></p>
</section>

<section class="pain-grid">
<div class="pain-card"><span>01 · 老闆</span><h3>「我知道很多事情重要，但我沒有時間每一件都想清楚。」</h3><p>資料散落、選項很多、每個決定都牽動成本。真正稀缺的是管理者的注意力。</p></div>
<div class="pain-card"><span>02 · 專業團隊</span><h3>「最累的不是做事，是每次都要重新判斷。」</h3><p>重複整理、分類、追蹤與交接，把高價值的人力耗在低價值摩擦上。</p></div>
<div class="pain-card"><span>03 · 個人</span><h3>「我不是沒有能力，我只是現在很需要有人陪我把事情拆開。」</h3><p>很多人生選擇沒有標準答案，但可以有更好的準備、更清楚的選項與更有底氣的下一步。</p></div>
</section>

<section class="decision-promise">
<div><div class="section-kicker">OUR PROMISE</div><h2>把「我不知道怎麼辦」<br/>變成「我知道下一步要看什麼」。</h2></div>
<div class="promise-copy"><p>澄思的核心不是預測未來，也不是把人的判斷拿走。核心是把原本需要大量人工整理的資訊、脈絡、選項、風險與準備工作接住。</p><p><strong>讓人少一點混亂，多一點理解；少一點重工，多一點真正需要人的時間。</strong></p></div>
</section>

<section class="business-band" id="business">
<div class="invest-head"><div class="section-kicker">HOW THE BUSINESS WORKS</div><h2>我們不是靠「賣一個 AI 功能」賺錢。</h2><p>真正的商業價值，是把一個人每天反覆做的判斷工作，變成願意持續付費的產品；再把同一套能力嵌入企業流程，從單點工具走向平台收入。</p></div>
<div class="business-funnel">
<div class="funnel-step"><b>第一層</b><h3>個人訂閱</h3><p>履歷、研究、自我探索等高頻需求，讓使用者先體驗「被接住」的價值。</p><strong>收入邏輯｜月／年訂閱</strong></div>
<div class="funnel-step"><b>第二層</b><h3>企業 SaaS</h3><p>把決策能力放進 HR、行銷、資安、營運等日常工作，形成持續使用與席次收入。</p><strong>收入邏輯｜席次／用量／方案</strong></div>
<div class="funnel-step"><b>第三層</b><h3>API 與白標</h3><p>讓第三方產品直接調用能力，從「我們的網站」走進「別人的產品」。</p><strong>收入邏輯｜API 用量／授權</strong></div>
<div class="funnel-step"><b>第四層</b><h3>企業整合</h3><p>依組織流程、權限、治理與資料需求做深度整合，提升客戶黏著與導入深度。</p><strong>收入邏輯｜專案／年度合約</strong></div>
</div>
<div class="money-callout"><span>投資人真正該看的，不只是功能數量</span><strong>而是「一次開發 → 多場景重用 → 多種收入入口」的能力。</strong></div>
</section>

<section class="platform-section" id="platform">
<div class="invest-head"><div class="section-kicker">THE PLATFORM</div><h2>8 個產品只是前台。<br/><span class="hl">真正要累積的是後面的 Decision Layer。</span></h2><p>今天使用者在意的是「這個工具有沒有幫我解決問題」；長期企業價值則來自一套可以跨場景複製、治理與持續學習的底層能力。</p></div>
<div class="platform-grid">
<div class="info-card"><div class="mini">01 · 理解</div><h3>Context Engine</h3><p>理解角色、目標、限制、資料來源與情境，避免 AI 只看到一句問題，卻看不到真正的問題。</p></div>
<div class="info-card"><div class="mini">02 · 分析</div><h3>Reasoning Layer</h3><p>把資料轉成原因、選項、比較與風險，而不是只產生一段看起來很完整的文字。</p></div>
<div class="info-card"><div class="mini">03 · 行動</div><h3>Action Layer</h3><p>將建議連到工作流、提醒、紀錄與人工覆核，讓 AI 的價值從「回答」走到「工作真的往前走」。</p></div>
<div class="info-card"><div class="mini">04 · 回饋</div><h3>Outcome Memory</h3><p>記錄決策與後續結果，在合適的資料治理前提下，讓產品逐步從一次性工具走向長期使用。</p></div>
<div class="info-card"><div class="mini">05 · 治理</div><h3>Trust Layer</h3><p>權限、紀錄、可追溯性、人工介入與風險邊界，讓企業敢把 AI 放進真正重要的流程。</p></div>
<div class="info-card"><div class="mini">06 · 擴張</div><h3>Platform Economics</h3><p>共同底座降低新場景開發的重複成本，讓產品矩陣可以透過 SaaS、API 與白標持續擴張。</p></div>
</div>
</section>

<section class="moat-section">
<div class="invest-head"><div class="section-kicker">WHY IT CAN COMPOUND</div><h2>真正的護城河，不是「我們也用了 AI」。</h2><p>模型會進步、功能會被複製；真正值得累積的是<strong>決策場景、工作流程、回饋資料、治理能力與使用者信任</strong>。</p></div>
<div class="moat-grid">
<div><span>01</span><h3>場景資料</h3><p>知道不同角色在什麼情境下提出什麼問題，以及哪些資訊真正有用。</p></div>
<div><span>02</span><h3>決策記憶</h3><p>從單次對話走向持續脈絡，讓使用者不用每次從頭解釋。</p></div>
<div><span>03</span><h3>結果回饋</h3><p>把「最後發生了什麼」帶回產品，而不是永遠停在產生答案的那一刻。</p></div>
<div><span>04</span><h3>企業治理</h3><p>越重要的流程，越需要權限、稽核、人工覆核與責任邊界。</p></div>
</div>
</section>

<section class="trust-section" id="trust">
<div class="invest-head"><div class="section-kicker">TRUST IS A PRODUCT FEATURE</div><h2>越接近錢、工作與人生，<br/>越不能假裝 AI 什麼都知道。</h2><p>信任不是頁尾的一段免責聲明，而是產品本身的一部分。</p></div>
<div class="trust-grid"><div class="info-card"><div class="mini">透明</div><h3>AI 就說 AI，規則就說規則</h3><p>清楚區分 AI 推論、資料、規則引擎與人工判斷，讓使用者知道「這個結論從哪裡來」。</p></div><div class="info-card"><div class="mini">可控</div><h3>重要決策，最後一票留給人</h3><p>投資、人才、健康／心理與其他高影響場景，不把 AI 輸出包裝成不可質疑的最終答案。</p></div><div class="info-card"><div class="mini">可回看</div><h3>每一次重要操作，都應該有跡可循</h3><p>透過權限、紀錄與治理機制，讓企業能追蹤關鍵操作、輸入與判斷依據。</p></div></div>
</section>

<section class="invest" id="investor">
<div class="invest-head"><div class="section-kicker">THE INVESTMENT STORY</div><h2>如果把今天的 8 個產品放在一起看，真正的故事是什麼？</h2><p>不是「我們做了很多 AI 小工具」。而是：<strong>我們正在用多個真實場景，驗證同一套決策基礎設施能不能被個人使用、被企業付費、被第三方整合，最後形成平台。</strong></p></div>
<div class="invest-grid"><div class="invest-item"><div class="icon">01</div><h3>先用場景證明價值</h3><p>每個產品都從一個明確痛點切入：少整理、少遺漏、少猜測、多準備、多可解釋性。</p></div><div class="invest-item"><div class="icon">02</div><h3>再用共用底座放大</h3><p>同一套理解、分析、工作流與治理能力，可以被不同垂直產品重複使用，形成產品矩陣。</p></div><div class="invest-item"><div class="icon">03</div><h3>最後把能力變成平台</h3><p>當能力可以被 API、白標與企業系統調用，價值就不只存在於自己的網站，而能進入更多工作流程。</p></div></div>
</section>

<section class="cta-section">
<div class="cta-box"><div class="section-kicker">START WITH A REAL PROBLEM</div><h2>不要先問「AI 還能做什麼」。<br/><span class="hl">先問：你現在最不想一個人扛的是什麼？</span></h2><p>一個行銷決策、一個資安告警、一套混亂流程、一場面試、一個人才判斷，甚至是一個只有你自己知道有多難的選擇。從真實問題開始，才有真正的產品價值。</p><a class="cta" href="#portfolio">選一個問題，開始探索 →</a></div>
</section>
</div>
